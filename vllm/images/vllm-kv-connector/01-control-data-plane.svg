<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="950" viewBox="0 0 1600 950" role="img" aria-labelledby="title desc">
  <title id="title">vLLM V1 KV Connector control plane and data plane</title>
  <desc id="desc">Diagram separating Scheduler-side ownership and metadata from Worker-side KV movement to NIXL, Mooncake, CPU and storage backends.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f9fbff"/>
      <stop offset="1" stop-color="#edf7f5"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#42516a"/>
    </marker>
    <marker id="arrowData" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#147d68"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.12"/>
    </filter>
    <style>
      .title { font: 700 34px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      .subtitle { font: 400 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #536078; }
      .lane-title { font: 700 24px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      .node-title { font: 650 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      .body { font: 400 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #465269; }
      .small { font: 500 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #5c6a82; }
      .control { fill: none; stroke: #42516a; stroke-width: 2.4; marker-end: url(#arrow); }
      .control-dash { fill: none; stroke: #687890; stroke-width: 2.2; stroke-dasharray: 8 7; marker-end: url(#arrow); }
      .data { fill: none; stroke: #147d68; stroke-width: 5; marker-end: url(#arrowData); }
    </style>
  </defs>

  <rect width="1600" height="950" fill="url(#bg)"/>
  <text x="70" y="62" class="title">vLLM V1 KV Connector：控制面决定“何时与哪块”，数据面执行“搬什么”</text>
  <text x="70" y="95" class="subtitle">整理者重绘 · 基于 main@f727951d · 灰色细线为 metadata/完成通知，绿色粗线为 KV bytes</text>

  <g filter="url(#shadow)">
    <rect x="70" y="145" width="560" height="590" rx="22" fill="#fff8e4" stroke="#d2ac43" stroke-width="2"/>
    <rect x="680" y="145" width="260" height="590" rx="22" fill="#f1f4f9" stroke="#93a0b4" stroke-width="2"/>
    <rect x="990" y="145" width="540" height="590" rx="22" fill="#eaf7f2" stroke="#46a184" stroke-width="2"/>
  </g>

  <text x="100" y="188" class="lane-title">Scheduler 控制面</text>
  <text x="710" y="188" class="lane-title">进程边界</text>
  <text x="1020" y="188" class="lane-title">Worker 数据面</text>

  <rect x="110" y="225" width="480" height="96" rx="14" fill="#ffffff" stroke="#c49b2f"/>
  <text x="140" y="261" class="node-title">本地 + 远端 prefix lookup</text>
  <text x="140" y="289" class="body">remote hit / pending(None) / miss</text>

  <rect x="110" y="360" width="480" height="96" rx="14" fill="#ffffff" stroke="#c49b2f"/>
  <text x="140" y="396" class="node-title">KVCacheManager 分配目标 block</text>
  <text x="140" y="424" class="body">Connector 不能自行改变 BlockPool 所有权</text>

  <rect x="110" y="495" width="480" height="96" rx="14" fill="#ffffff" stroke="#c49b2f"/>
  <text x="140" y="531" class="node-title">请求状态与释放协议</text>
  <text x="140" y="559" class="body">WAITING_REMOTE · completion · delayed free / fence</text>

  <rect x="110" y="630" width="480" height="70" rx="14" fill="#ffffff" stroke="#c49b2f"/>
  <text x="140" y="672" class="node-title">Scheduler-side Connector</text>

  <path d="M350 321 V360" class="control"/>
  <path d="M350 456 V495" class="control"/>
  <path d="M350 591 V630" class="control"/>

  <rect x="715" y="245" width="190" height="118" rx="14" fill="#ffffff" stroke="#8290a5"/>
  <text x="744" y="283" class="node-title">Metadata</text>
  <text x="744" y="310" class="body">keys / block ids</text>
  <text x="744" y="336" class="body">jobs / remote agent</text>

  <rect x="715" y="500" width="190" height="145" rx="14" fill="#ffffff" stroke="#8290a5"/>
  <text x="744" y="538" class="node-title">Output</text>
  <text x="744" y="565" class="body">finished send/recv</text>
  <text x="744" y="591" class="body">invalid ids</text>
  <text x="744" y="617" class="body">stats / events</text>

  <rect x="1030" y="225" width="460" height="96" rx="14" fill="#ffffff" stroke="#278b70"/>
  <text x="1060" y="261" class="node-title">注册物理 KV tensor / host buffer</text>
  <text x="1060" y="289" class="body">layout · PP/TP geometry · descriptors</text>

  <rect x="1030" y="360" width="460" height="96" rx="14" fill="#ffffff" stroke="#278b70"/>
  <text x="1060" y="396" class="node-title">执行 load / save</text>
  <text x="1060" y="424" class="body">layer hook、整块 I/O 或后台线程</text>

  <rect x="1030" y="495" width="460" height="96" rx="14" fill="#ffffff" stroke="#278b70"/>
  <text x="1060" y="531" class="node-title">聚合完成与失败</text>
  <text x="1060" y="559" class="body">所有需要的 Worker 完成后才提升请求</text>

  <rect x="1030" y="630" width="460" height="70" rx="14" fill="#ffffff" stroke="#278b70"/>
  <text x="1060" y="672" class="node-title">Worker-side Connector</text>

  <path d="M1260 321 V360" class="control"/>
  <path d="M1260 456 V495" class="control"/>
  <path d="M1260 591 V630" class="control"/>

  <path d="M590 665 C650 665 655 304 715 304" class="control-dash"/>
  <path d="M905 304 C960 304 975 408 1030 408" class="control-dash"/>
  <path d="M1030 543 C970 543 965 572 905 572" class="control-dash"/>
  <path d="M715 572 C655 572 650 543 590 543" class="control-dash"/>

  <g filter="url(#shadow)">
    <rect x="115" y="790" width="300" height="95" rx="18" fill="#ffffff" stroke="#31947c"/>
    <rect x="470" y="790" width="300" height="95" rx="18" fill="#ffffff" stroke="#31947c"/>
    <rect x="825" y="790" width="300" height="95" rx="18" fill="#ffffff" stroke="#31947c"/>
    <rect x="1180" y="790" width="300" height="95" rx="18" fill="#ffffff" stroke="#31947c"/>
  </g>
  <text x="145" y="829" class="node-title">NIXL P/D</text>
  <text x="145" y="857" class="body">READ / WRITE registered memory</text>
  <text x="500" y="829" class="node-title">Mooncake</text>
  <text x="500" y="857" class="body">P2P 或 Distributed Store</text>
  <text x="855" y="829" class="node-title">Offloading tiers</text>
  <text x="855" y="857" class="body">CPU / FS / object / P2P</text>
  <text x="1210" y="829" class="node-title">其他适配器</text>
  <text x="1210" y="857" class="body">LMCache / FlexKV / HF3FS …</text>

  <path d="M1260 700 C1260 755 265 745 265 790" class="data"/>
  <path d="M1260 700 C1260 755 620 745 620 790" class="data"/>
  <path d="M1260 700 C1260 755 975 745 975 790" class="data"/>
  <path d="M1260 700 V790" class="data"/>

  <text x="70" y="925" class="subtitle">正确性闭环：分配目标块 → 传输 → 全 Worker 完成/失败聚合 → 缓存或重算 → 安全释放。</text>
</svg>
