<svg xmlns="http://www.w3.org/2000/svg" width="840" height="950" viewBox="0 0 840 950" role="img" aria-labelledby="title desc">
<title id="title">11 · LayerNorm：把每个 token 的刻度整理好 ★</title><desc id="desc">分别处理每个向量，不把整句话的数字混在一起求平均。。人工教学示例，不代表实测模型。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="context-stroke"/></marker><pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M0,10 L10,0" stroke="#c65255" stroke-width="1" opacity=".3"/></pattern></defs>
<rect width="840" height="950" fill="#fbfaf7" rx="16"/>
<g font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">
<text x="32" y="49" font-size="32" font-weight="650" fill="#192d42" text-anchor="start">11  LayerNorm：把每个 token 的刻度整理好 ★</text>
<text x="32" y="90" font-size="24" font-weight="400" fill="#536778" text-anchor="start">分别处理每个向量，不把整句话的数字混在一起求平均。</text>
<path d="M32,113 L808,113" fill="none" stroke="#d7ddd9" stroke-width="2" opacity="1"/>
<text x="32" y="928" font-size="19" font-weight="400" fill="#536778" text-anchor="start">原创教学示意 · 数字为人工例子 · ★ 核心模块</text>
<text x="40" y="188" font-size="28" font-weight="650" fill="#2870c5" text-anchor="start">token A  [1, 3]</text>
<path d="M90,226 L738,226" fill="none" stroke="#a0adb9" stroke-width="2" opacity="1"/>
<path d="M90.0,221 L90.0,231" fill="none" stroke="#a0adb9" stroke-width="2" opacity="1"/>
<text x="90.0" y="262" font-size="21" font-weight="400" fill="#192d42" text-anchor="middle">0</text>
<path d="M219.60000000000002,221 L219.60000000000002,231" fill="none" stroke="#a0adb9" stroke-width="2" opacity="1"/>
<text x="219.60000000000002" y="262" font-size="21" font-weight="400" fill="#192d42" text-anchor="middle">3</text>
<path d="M349.20000000000005,221 L349.20000000000005,231" fill="none" stroke="#a0adb9" stroke-width="2" opacity="1"/>
<text x="349.20000000000005" y="262" font-size="21" font-weight="400" fill="#192d42" text-anchor="middle">6</text>
<path d="M478.8,221 L478.8,231" fill="none" stroke="#a0adb9" stroke-width="2" opacity="1"/>
<text x="478.8" y="262" font-size="21" font-weight="400" fill="#192d42" text-anchor="middle">9</text>
<path d="M608.4000000000001,221 L608.4000000000001,231" fill="none" stroke="#a0adb9" stroke-width="2" opacity="1"/>
<text x="608.4000000000001" y="262" font-size="21" font-weight="400" fill="#192d42" text-anchor="middle">12</text>
<path d="M738.0,221 L738.0,231" fill="none" stroke="#a0adb9" stroke-width="2" opacity="1"/>
<text x="738.0" y="262" font-size="21" font-weight="400" fill="#192d42" text-anchor="middle">15</text>
<circle cx="133.2" cy="226" r="11" fill="#2870c5" stroke="none" stroke-width="2"/>
<circle cx="219.60000000000002" cy="226" r="11" fill="#2870c5" stroke="none" stroke-width="2"/>
<path d="M176.4,200 L176.4,238" fill="none" stroke="#2870c5" stroke-width="2" opacity="1" stroke-dasharray="6 5"/>
<text x="740" y="192" font-size="24" font-weight="400" fill="#2870c5" text-anchor="end">μ=2</text>
<text x="40" y="309" font-size="24" font-weight="400" fill="#2870c5" text-anchor="start">各自减去均值 2，再除以标准差 1</text>
<text x="40" y="373" font-size="28" font-weight="650" fill="#8255b4" text-anchor="start">token B  [10, 14]</text>
<path d="M90,411 L738,411" fill="none" stroke="#a0adb9" stroke-width="2" opacity="1"/>
<path d="M90.0,406 L90.0,416" fill="none" stroke="#a0adb9" stroke-width="2" opacity="1"/>
<text x="90.0" y="447" font-size="21" font-weight="400" fill="#192d42" text-anchor="middle">0</text>
<path d="M219.60000000000002,406 L219.60000000000002,416" fill="none" stroke="#a0adb9" stroke-width="2" opacity="1"/>
<text x="219.60000000000002" y="447" font-size="21" font-weight="400" fill="#192d42" text-anchor="middle">3</text>
<path d="M349.20000000000005,406 L349.20000000000005,416" fill="none" stroke="#a0adb9" stroke-width="2" opacity="1"/>
<text x="349.20000000000005" y="447" font-size="21" font-weight="400" fill="#192d42" text-anchor="middle">6</text>
<path d="M478.8,406 L478.8,416" fill="none" stroke="#a0adb9" stroke-width="2" opacity="1"/>
<text x="478.8" y="447" font-size="21" font-weight="400" fill="#192d42" text-anchor="middle">9</text>
<path d="M608.4000000000001,406 L608.4000000000001,416" fill="none" stroke="#a0adb9" stroke-width="2" opacity="1"/>
<text x="608.4000000000001" y="447" font-size="21" font-weight="400" fill="#192d42" text-anchor="middle">12</text>
<path d="M738.0,406 L738.0,416" fill="none" stroke="#a0adb9" stroke-width="2" opacity="1"/>
<text x="738.0" y="447" font-size="21" font-weight="400" fill="#192d42" text-anchor="middle">15</text>
<circle cx="522.0" cy="411" r="11" fill="#8255b4" stroke="none" stroke-width="2"/>
<circle cx="694.8000000000001" cy="411" r="11" fill="#8255b4" stroke="none" stroke-width="2"/>
<path d="M608.4000000000001,385 L608.4000000000001,423" fill="none" stroke="#8255b4" stroke-width="2" opacity="1" stroke-dasharray="6 5"/>
<text x="740" y="377" font-size="24" font-weight="400" fill="#8255b4" text-anchor="end">μ=12</text>
<text x="40" y="494" font-size="24" font-weight="400" fill="#8255b4" text-anchor="start">各自减去均值 12，再除以标准差 2</text>
<text x="40" y="587" font-size="26" font-weight="650" fill="#192d42" text-anchor="start">整理后（暂设 γ=1、β=0，忽略 ε）</text>
<path d="M233,648 L627,648" fill="none" stroke="#a0adb9" stroke-width="2" opacity="1"/>
<circle cx="295" cy="648" r="11" fill="#2870c5" stroke="none" stroke-width="2"/>
<path d="M430,636 L430,660" fill="none" stroke="#a0adb9" stroke-width="2" opacity="1"/>
<circle cx="565" cy="648" r="11" fill="#2870c5" stroke="none" stroke-width="2"/>
<text x="165" y="656" font-size="26" font-weight="650" fill="#2870c5" text-anchor="start">A</text>
<path d="M233,721 L627,721" fill="none" stroke="#a0adb9" stroke-width="2" opacity="1"/>
<circle cx="295" cy="721" r="11" fill="#8255b4" stroke="none" stroke-width="2"/>
<path d="M430,709 L430,733" fill="none" stroke="#a0adb9" stroke-width="2" opacity="1"/>
<circle cx="565" cy="721" r="11" fill="#8255b4" stroke="none" stroke-width="2"/>
<text x="165" y="729" font-size="26" font-weight="650" fill="#8255b4" text-anchor="start">B</text>
<text x="295" y="771" font-size="25" font-weight="400" fill="#192d42" text-anchor="middle">−1</text>
<text x="430" y="771" font-size="25" font-weight="400" fill="#192d42" text-anchor="middle">0</text>
<text x="565" y="771" font-size="25" font-weight="400" fill="#192d42" text-anchor="middle">1</text>
<text x="40" y="835" font-size="25" font-weight="400" fill="#192d42" text-anchor="start">相对分布被整理到同一尺度；再由 γ、β 调整刻度。</text>
<text x="40" y="884" font-size="24" font-weight="400" fill="#536778" text-anchor="start">它没有把两个 token 变成同一种含义。</text>
</g></svg>
