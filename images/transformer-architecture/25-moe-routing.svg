<text x="48" y="226" font-size="26" font-weight="400" fill="#192d42" text-anchor="start">Router 线性投影：d 维 → 4 个专家分数</text>
<text x="48" y="276" font-size="25" font-weight="400" fill="#192d42" text-anchor="start">本例 logits = [0, ln 6, ln 2, 0]；Top-2 选专家 2、3</text>
