<text x="505" y="482.0" font-size="24" font-weight="400" fill="#8255b4" text-anchor="start">专家 3：2 / (6+2) = 0.25</text>
<text x="70" y="531" font-size="24" font-weight="400" fill="#192d42" text-anchor="start">4</text>
<rect x="120" y="511" width="370" height="25" rx="3" fill="#f8f9fa" stroke="none" stroke-width="2"/>
