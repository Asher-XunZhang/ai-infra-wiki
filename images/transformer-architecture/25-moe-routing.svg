<text x="32" y="49" font-size="32" font-weight="650" fill="#192d42" text-anchor="start">25  MoE 手算：选四位中的两位，再汇总 ★</text>
<text x="32" y="90" font-size="24" font-weight="400" fill="#536778" text-anchor="start">同一个输入送入选中专家；汇总得到新的数字带，宽度仍是 d。</text>
