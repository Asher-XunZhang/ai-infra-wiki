<rect x="120" y="413" width="370" height="25" rx="3" fill="#f6f3fa" stroke="none" stroke-width="2"/>
<rect x="120" y="413" width="277.5" height="25" rx="3" fill="#8255b4" stroke="none" stroke-width="2"/>
