<text x="254" y="985" font-size="22" font-weight="400" fill="#c65255" text-anchor="middle">负数归零</text>
<text x="396" y="815" font-size="26" font-weight="400" fill="#536778" text-anchor="start">更多组合，各自有不同响应。</text>
<text x="396" y="850" font-size="26" font-weight="400" fill="#536778" text-anchor="start">负数被压到零，正数保留。</text>
<text x="396" y="885" font-size="26" font-weight="400" fill="#536778" text-anchor="start">下投影再利用这些加工结果。</text>
<text x="40" y="1061" font-size="25" font-weight="400" fill="#168574" text-anchor="start">若没有非线性，两次线性投影就能合成一次。</text>
<text x="40" y="1099" font-size="25" font-weight="400" fill="#168574" text-anchor="start">升维本身不会增加输入事实；降维也不是复原原输入。</text>
