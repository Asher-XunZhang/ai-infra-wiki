<text x="52" y="865" font-size="26" font-weight="650" fill="#168574" text-anchor="start">上面两笔账都还要另加共享模块与 Router</text>
<text x="52" y="903" font-size="23" font-weight="400" fill="#192d42" text-anchor="start">Attention 等共享计算照常执行；不是整个模型只有 2P。</text>
<text x="46" y="965" font-size="24" font-weight="400" fill="#536778" text-anchor="start">通常仍需存放全部专家权重；一个 batch 也可能用到全部专家。</text>
<text x="46" y="1001" font-size="24" font-weight="400" fill="#536778" text-anchor="start">路由、数据搬运和负载不均都会影响速度，不能用 4÷2 推断加速倍数。</text>
