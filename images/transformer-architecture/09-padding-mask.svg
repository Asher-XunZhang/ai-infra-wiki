<rect width="840" height="900" fill="#fbfaf7" rx="16"/>
<g font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">
<text x="32" y="49" font-size="32" font-weight="650" fill="#192d42" text-anchor="start">09  补齐的空位，为什么不能一起读？ ★</text>
<text x="32" y="90" font-size="24" font-weight="400" fill="#536778" text-anchor="start">Padding mask 排除占位符，否则它仍会分走权重。</text>
