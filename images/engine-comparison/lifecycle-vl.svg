        </g>
        <g data-detail="context" data-edge-from="waiting" data-edge-to="aborted" data-edge-label="取消等待请求" data-edge-key="4" data-edge-id="abort-wait">
          <rect x="138.5" y="147" width="84" height="16" rx="4" class="c-mask"/>
          <text x="180.5" y="158.5" class="t-muted" font-size="10" text-anchor="middle">取消等待请求</text>
        </g>
        <g data-detail="context" data-edge-from="running" data-edge-to="aborted" data-edge-label="取消执行中请求" data-edge-key="5" data-edge-id="abort-run">
