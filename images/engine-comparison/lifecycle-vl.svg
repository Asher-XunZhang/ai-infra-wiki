          </g>
          <text data-node-label="" data-detail-anchor="" x="240.7" y="211" class="t-primary" font-size="12" font-weight="600" text-anchor="middle">请求取消</text>
          <text data-detail="context" x="241.5" y="229" class="t-muted" font-size="9" text-anchor="middle">按状态分别收尾</text>
        </g>

        <!-- Transition labels -->
        <g data-detail="context" data-edge-from="waiting" data-edge-to="running" data-edge-label="预算与 KV 允许" data-edge-key="0" data-edge-id="admit">
          <rect x="209" y="38" width="96" height="16" rx="4" class="c-mask"/>
          <text x="257" y="49.5" class="t-edge-emphasis" font-size="10" text-anchor="middle">预算与 KV 允许</text>
        </g>
        <g data-detail="context" data-edge-from="running" data-edge-to="finished" data-edge-label="EOS / 长度终止" data-edge-key="1" data-edge-id="complete">
          <rect x="471" y="38" width="96" height="16" rx="4" class="c-mask"/>
          <text x="519" y="49.5" class="t-edge-emphasis" font-size="10" text-anchor="middle">EOS / 长度终止</text>
        </g>
        <g data-detail="context" data-edge-from="running" data-edge-to="retracted" data-edge-label="显存压力" data-edge-key="2" data-edge-id="preempt">
          <rect x="322" y="140" width="60" height="16" rx="4" class="c-mask"/>
