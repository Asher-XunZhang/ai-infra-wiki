<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 632 176" role="img" lang="zh-CN" aria-labelledby="archify-diagram-title archify-diagram-description" data-animation="trace" data-preset="classic" data-quality-profile="showcase" data-node-ui="" data-reader-fit="intrinsic-height" data-reader-min-text="7.5" data-reader-primary-text="14">
        <title id="archify-diagram-title">分层恢复：控制与 KV 驻留</title>
        <desc id="archify-diagram-description">由 Archify 生成的架构图。</desc>
        <style>.c-mask { fill:var(--ac-surface,#101720); }
.c-grid { fill:none; stroke:var(--ac-grid,#1c2834); }
.c-region,.c-security-group { fill:var(--ac-frame-fill,#111b26); stroke:var(--ac-frame,#60738a); stroke-width:1; }
.c-lane { fill:var(--ac-frame-fill,#111b26); stroke:var(--ac-frame,#60738a); }
.c-backend,.c-frontend,.c-cloud,.c-database,.c-messagebus,.c-security,.c-external,
.c-start,.c-active,.c-waiting,.c-decision,.c-success,.c-failure,.c-neutral {
 fill:var(--ac-node,#172433); stroke:var(--ac-accent,#94a8ff); }
.a-default,.a-emphasis,.a-dashed,.a-return,.a-security { fill:none; stroke:var(--ac-line,#91a0b4); }
.a-dashed { stroke-dasharray:4 4; }
.a-return { stroke-dasharray:3 4; }
.a-emphasis { stroke-width:2; }
.m-default,.m-emphasis,.m-dashed,.m-return,.m-security { fill:var(--ac-line,#91a0b4); }
.t-primary { fill:var(--ac-text,#edf2f7); }
.t-muted,.t-label,.t-small { fill:var(--ac-muted,#a8b7c8); }
text { fill:var(--ac-text,#edf2f7); font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; }
[data-semantic-sigil] { display:none; }
[data-graph-role="structural-frame-label-mask"],.phase-chip { fill:var(--ac-surface,#101720); stroke:var(--ac-frame,#60738a); }
</style><!-- Definitions -->
        <defs>
