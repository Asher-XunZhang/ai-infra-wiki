<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="820" viewBox="0 0 1080 820" role="img" aria-labelledby="title desc">
<title id="title">SGLang PD 分离：请求、协调与 KV 三条通路</title><desc id="desc">整理者依据固定源码绘制的实例职责图。P 与 D 接收关联请求，D 提供接收描述，P 向 D 搬运 KV 和 aux，D 校验后继续调度。控制完成与实际数据安全是不同条件。</desc>
<defs><marker id="blue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0 0L9 4.5L0 9Z" fill="#286aa6"/></marker><marker id="orange" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0 0L9 4.5L0 9Z" fill="#9a5c17"/></marker><marker id="green" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0 0L9 4.5L0 9Z" fill="#18745a"/></marker></defs>
<rect width="1080" height="820" fill="#ffffff"/>
<style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#18324a;font-size:18px}.heading{font-size:27px;font-weight:700}.sub{font-size:16px;fill:#51677b}.label{font-size:17px}.boxtitle{font-size:20px;font-weight:600}.edge{fill:none;stroke-linejoin:round;stroke-width:2.3}.request{stroke:#286aa6;marker-end:url(#blue)}.control{stroke:#9a5c17;stroke-dasharray:7 5;marker-end:url(#orange)}.data{stroke:#18745a;stroke-width:4;marker-end:url(#green)}</style>
<text x="35" y="42" class="heading" text-anchor="start">PD 分离：同一请求，三种不同的交接</text>
<text x="35" y="70" class="sub" text-anchor="start">教学视图 · 普通 HTTP PDRouter / Mooncake 主线 · 不代表所有后端的完成语义</text>
<rect x="390" y="95" width="300" height="46" rx="10" fill="#eff6ff" stroke="#a4bfd6"/>
<text x="540.0" y="124.0" class="" text-anchor="middle">客户端</text>
<rect x="390" y="180" width="300" height="54" rx="10" fill="#eff6ff" stroke="#a4bfd6"/>
<text x="540.0" y="213.0" class="" text-anchor="middle">HTTP PDRouter</text>
<rect x="30" y="305" width="450" height="425" rx="14" fill="#f4f8fd" stroke="#acc4d9"/>
<text x="55" y="337" class="boxtitle" text-anchor="start">Prefill 实例</text>
<rect x="580" y="305" width="450" height="425" rx="14" fill="#f0f8f5" stroke="#9ecab8"/>
<text x="605" y="337" class="boxtitle" text-anchor="start">Decode 实例</text>
<rect x="70" y="365" width="370" height="64" rx="10" fill="#fff" stroke="#a8bbca"/>
<text x="255.0" y="391.0" class="" text-anchor="middle">P 入口 / Scheduler / 模型</text>
<text x="255.0" y="416.0" class="" text-anchor="middle">处理 Prefill 子请求</text>
<rect x="70" y="520" width="370" height="62" rx="10" fill="#fff" stroke="#a8bbca"/>
<text x="255.0" y="545.0" class="" text-anchor="middle">P bootstrap / sender 管理</text>
<text x="255.0" y="570.0" class="" text-anchor="middle">组织发送与状态通知</text>
<rect x="70" y="635" width="370" height="58" rx="10" fill="#e6f4ee" stroke="#8abcaa"/>
<text x="255.0" y="670.0" class="" text-anchor="middle">P 本地 KV / aux 源缓冲区</text>
<rect x="620" y="365" width="370" height="64" rx="10" fill="#fff" stroke="#a8bbca"/>
<text x="805.0" y="391.0" class="" text-anchor="middle">D 入口 / Scheduler / 模型</text>
<text x="805.0" y="416.0" class="" text-anchor="middle">就绪后继续 Decode</text>
<rect x="620" y="520" width="370" height="62" rx="10" fill="#fff" stroke="#a8bbca"/>
<text x="805.0" y="545.0" class="" text-anchor="middle">D receiver / transfer queue</text>
<text x="805.0" y="570.0" class="" text-anchor="middle">校验关联、结果与放行条件</text>
<rect x="620" y="635" width="370" height="58" rx="10" fill="#e6f4ee" stroke="#8abcaa"/>
<text x="805.0" y="670.0" class="" text-anchor="middle">D 本地 KV / aux 目标缓冲区</text>
<path d="M540 141V180" class="edge request"/>
<path d="M640 180V141" class="edge request"/>
<path d="M450 234V268H255V365" class="edge request"/>
<text x="75" y="289" class="label" text-anchor="start">① 关联 HTTP 子请求 / room</text>
<path d="M630 234V268H805V365" class="edge request"/>
<text x="675" y="289" class="label" text-anchor="start">① 关联 HTTP 子请求 / room</text>
<path d="M990 396H1053V207H690" class="edge request"/>
<text x="1038" y="245" class="label" text-anchor="end">响应</text>
<path d="M620 397H536V473H255V520" class="edge control"/>
<text x="270" y="464" class="label" text-anchor="start">② 查询拓扑 / 发布接收描述</text>
<path d="M125 429V520" class="edge control"/>
<text x="140" y="496" class="label" text-anchor="start">本地发送任务</text>
<path d="M440 548H620" class="edge control"/>
<text x="530" y="510" class="label" text-anchor="middle">② 状态通知</text>
<path d="M255 582V635" class="edge control"/>
<text x="269" y="614" class="label" text-anchor="start">组织传输</text>
<path d="M440 664H620" class="edge data"/>
<text x="530" y="625" class="label" text-anchor="middle">③ KV / aux 字节</text>
<path d="M805 635V582" class="edge data"/>
<text x="819" y="614" class="label" text-anchor="start">接收结果</text>
<path d="M890 520V429" class="edge control"/>
<text x="904" y="474" class="label" text-anchor="start">就绪</text>
<text x="55" y="710" class="sub" text-anchor="start">源数据由 Prefill 计算产生</text>
<text x="605" y="710" class="sub" text-anchor="start">目标位置先分配，数据到达后再校验</text>
<text x="35" y="772" class="sub" text-anchor="start">蓝实线：业务请求 / 响应      橙虚线：协调与状态      绿粗线：模型状态数据</text>
<text x="35" y="800" class="sub" text-anchor="start">特别注意：收到控制消息、收到数据、允许调度、允许回收，是需要分别确认的条件。</text>
</svg>
