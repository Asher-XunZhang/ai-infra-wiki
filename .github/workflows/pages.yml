name: Deploy interactive learning pages

on:
  push:
    branches: [main]
    paths:
      - 'pages/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'Asher-XunZhang/ai-infra-wiki'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate documentation
        run: python3 -B scripts/check_learning_docs.py
      - name: Validate and rebuild timing scenarios
        run: |
          python3 -B tests/pp/test_pp_timing_model.py
          python3 -B tests/pp/build_pp_scenarios.py
          python3 -B tests/pp/test_pp_custom_timing.py
          python3 -B tests/pp/test_pp_dependency_view.py
          python3 -B tests/pp/test_pp_step_guide.py
          python3 -B tests/pp/check_pp_source.py
      - name: Validate parameterized request lifecycle
        run: |
          node tests/pages/test_prefill_lifecycle.cjs
          node tests/pages/test_pd_dataflow.cjs
          node tests/pages/test_pd_queues.cjs
      - name: Validate beginner inference teaching models
        run: |
          node tests/pages/test_inference_overview.cjs
          node tests/pages/test_request_runtime.cjs
          node tests/pages/test_parallelism.cjs
          node tests/pages/test_communication.cjs
          node tests/pages/test_generation.cjs
          node tests/pages/test_serving.cjs
          node tests/pages/test_performance.cjs
          node tests/pages/test_execution.cjs
          node tests/pages/test_kv_memory.cjs
          node tests/pages/test_scheduling.cjs
          node tests/pages/test_system_overview.cjs
      - name: Build pages with content-versioned assets
        run: python3 scripts/build_pages.py
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: .pages-dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
