name: Deploy interactive learning pages

on:
  push:
    branches: [main]
    paths:
      - 'pages/**'
      - 'scripts/build_pages.py'
      - 'scripts/build_pp_scenarios.py'
      - 'scripts/build_pp_quick_data.py'
      - 'scripts/pp_timing_model.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'Asher-XunZhang/ai-infra-wiki'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate and rebuild timing scenarios
        run: python3 -B scripts/build_pp_scenarios.py
      - name: Build pages with content-versioned assets
        run: python3 scripts/build_pages.py
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: .pages-dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
